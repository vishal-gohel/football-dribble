<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Football Dribble Climber</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1a472a;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; }
    
    #user-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(26,71,42,0.97) 0%, rgba(15,50,30,0.98) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
    }
    #user-modal.hidden { display: none; }
    
    #user-modal h2 {
      margin-bottom: 8px; font-weight: bold; letter-spacing: 3px;
      font-size: 20px; color: #86efac;
    }
    #user-modal .emoji-ball {
      font-size: 48px; margin-bottom: 16px;
    }
    #user-modal .subtitle {
      font-size: 12px; color: #4ade80; letter-spacing: 2px; margin-bottom: 28px;
    }
    
    #username-input {
      padding: 14px 22px; font-size: 16px; 
      border: 2px solid rgba(255,255,255,0.25); border-radius: 24px;
      background: rgba(255, 255, 255, 0.08); color: #ffffff;
      outline: none; text-align: center; width: 260px;
      margin-bottom: 20px;
      backdrop-filter: blur(4px);
      transition: border-color 0.2s, background 0.2s;
    }
    #username-input::placeholder { color: rgba(187, 247, 208, 0.5); }
    #username-input:focus { border-color: #fb923c; background: rgba(255,255,255,0.14); }
    
    #start-btn {
      padding: 14px 36px; font-size: 15px; font-weight: bold;
      border: none; border-radius: 24px; cursor: pointer;
      background: linear-gradient(135deg, #f97316, #fb923c);
      color: #ffffff; letter-spacing: 2px;
      box-shadow: 0 4px 20px rgba(249, 115, 22, 0.35);
      transition: transform 0.1s;
    }
    #start-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div id="user-modal" class="hidden">
    <div class="emoji-ball">⚽</div>
    <h2>ENTER THE PITCH</h2>
    <div class="subtitle">WHAT'S YOUR NAME, PLAYER?</div>
    <input type="text" id="username-input" placeholder="Your name..." autocomplete="off">
    <button id="start-btn">KICK OFF</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
